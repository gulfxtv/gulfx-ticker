<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GulfX TV — The Announcement Countdown</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #081a33 0%, #102f5c 100%);
    color: #faf4e3;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden; position:relative;
  }
  .glow { position:absolute; width:860px; height:660px; left:50%; top:50%;
    transform:translate(-50%,-50%); border-radius:50%;
    background: radial-gradient(ellipse at center, rgba(30,66,110,.85) 0%, rgba(30,66,110,0) 65%); }
  .wrap { position:relative; text-align:center; padding:28px 16px 22px; width:100%; max-width:940px; }
  .brand { font-weight:800; letter-spacing:3px; font-size:clamp(20px,3.4vw,30px); color:#fff; }
  .brand .x { color:#f0cd6e; }
  .brand-sub { color:#f0cd6e; letter-spacing:6px; font-size:clamp(10px,1.6vw,13px); margin-top:2px; }
  .eyebrow { margin-top:30px; color:#c9a227; letter-spacing:5px; font-weight:700;
    font-size:clamp(13px,2.4vw,21px); }
  h1 { margin-top:8px; font-size:clamp(30px,6.4vw,62px); font-weight:800; letter-spacing:1px; color:#faf4e3; }
  .rule { width:min(600px,70%); height:3px; background:#c9a227; margin:18px auto 26px; border-radius:2px; }
  .boxes { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .box { width:clamp(120px,20vw,196px); background:rgba(10,34,58,.92); border:2px solid #5c8b96;
    border-radius:16px; padding:16px 6px 12px; }
  .num { font-size:clamp(38px,7vw,72px); font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }
  .lab { margin-top:8px; color:#f0cd6e; letter-spacing:3px; font-weight:700; font-size:clamp(10px,1.8vw,15px); }
  .box.seconds { border-color:#f0cd6e; }
  .box.seconds.pulse { animation:pulse .45s ease-out; }
  @keyframes pulse { 0% { transform:scale(1.05); } 100% { transform:scale(1); } }
  .date { margin-top:28px; color:#f0cd6e; font-weight:800; letter-spacing:1px; font-size:clamp(16px,3vw,27px); }
  .foot { margin-top:22px; color:#aacdf5; letter-spacing:2px; font-size:clamp(11px,1.8vw,14px); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand">GULF<span class="x">X</span> TV</div>
    <div class="brand-sub">YOUR LOCAL CONNECTION</div>
    <div class="eyebrow">SOMETHING BIG IS COMING</div>
    <h1 id="headline">THE ANNOUNCEMENT</h1>
    <div class="rule"></div>
    <div class="boxes">
      <div class="box"><div class="num" id="d">--</div><div class="lab">DAYS</div></div>
      <div class="box"><div class="num" id="h">--</div><div class="lab">HOURS</div></div>
      <div class="box"><div class="num" id="m">--</div><div class="lab">MINUTES</div></div>
      <div class="box seconds" id="secbox"><div class="num" id="s">--</div><div class="lab">SECONDS</div></div>
    </div>
    <div class="date">TUESDAY, DECEMBER 1 &bull; 6:00 PM</div>
    <div class="foot">STAY TUNED &bull; GULFXTV.COM</div>
  </div>
<script>
  // Target: Tuesday, December 1, 2026, 6:00 PM Central (CST = UTC-6) = 2026-12-02T00:00:00Z
  var TARGET = Date.UTC(2026, 11, 2, 0, 0, 0);
  var lastSec = -1;
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function tick(){
    var diff = TARGET - Date.now();
    if (diff <= 0) {
      document.getElementById("d").textContent = "00";
      document.getElementById("h").textContent = "00";
      document.getElementById("m").textContent = "00";
      document.getElementById("s").textContent = "00";
      document.getElementById("headline").textContent = "THE ANNOUNCEMENT IS HERE";
      return;
    }
    var total = Math.floor(diff / 1000);
    var days = Math.floor(total / 86400);
    var hrs  = Math.floor((total % 86400) / 3600);
    var min  = Math.floor((total % 3600) / 60);
    var sec  = total % 60;
    document.getElementById("d").textContent = pad(days);
    document.getElementById("h").textContent = pad(hrs);
    document.getElementById("m").textContent = pad(min);
    document.getElementById("s").textContent = pad(sec);
    if (sec !== lastSec) {
      lastSec = sec;
      var b = document.getElementById("secbox");
      b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");
    }
  }
  tick();
  setInterval(tick, 250);
</script>
</body>
</html>
