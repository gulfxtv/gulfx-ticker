<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GulfX TV &mdash; Gulf Coast Headlines</title>
</head>
<body style="margin:0;padding:20px;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<div style="max-width:720px;margin:0 auto">
<style>
.gx-news{box-sizing:border-box;max-width:100%;background:#0b1226;border:1px solid rgba(232,185,35,.25);border-radius:10px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#f1f5f9}
.gx-news *{box-sizing:border-box}
.gx-news-head{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#b8911a,#e8b923);color:#0b1226;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:10px 14px}
.gx-news-head .dot{width:8px;height:8px;border-radius:50%;background:#0b1226;animation:gxnblink 1.2s infinite}
@keyframes gxnblink{0%,100%{opacity:1}50%{opacity:.25}}
.gx-news-list{max-height:420px;overflow-y:auto}
.gx-news-item{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-top:1px solid rgba(255,255,255,.07)}
.gx-news-item:first-child{border-top:none}
.gx-news-src{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#0b1226;background:#e8b923;border-radius:5px;padding:3px 7px;margin-top:1px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.gx-news-body{flex:1;min-width:0}
.gx-news-title{font-size:14px;font-weight:600;line-height:1.35;margin:0 0 3px}
.gx-news-title a{color:#f1f5f9;text-decoration:none}
.gx-news-title a:hover{color:#e8b923;text-decoration:underline}
.gx-news-time{font-size:11px;color:#94a3b8}
.gx-news-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#94a3b8}
.gx-news-foot button{background:none;border:1px solid rgba(232,185,35,.5);color:#e8b923;border-radius:6px;font-size:11px;padding:3px 10px;cursor:pointer}
.gx-news-foot button:hover{background:rgba(232,185,35,.15)}
.gx-news-empty{padding:24px 14px;text-align:center;color:#94a3b8;font-size:13px}
</style>
<div class="gx-news" id="gx-news">
  <div class="gx-news-head"><span class="dot"></span>Gulf Coast Headlines</div>
  <div class="gx-news-list" id="gx-news-list"></div>
  <div class="gx-news-foot"><span id="gx-news-updated"></span><button id="gx-news-refresh" type="button">&#8635; Refresh</button></div>
</div>
<script>
(function(){
var FEEDS=["https://news.google.com/rss/search?q=Gulfport%20Mississippi&hl=en-US&gl=US&ceid=US:en", "https://news.google.com/rss/search?q=Biloxi%20Mississippi&hl=en-US&gl=US&ceid=US:en", "https://news.google.com/rss/search?q=%22Mississippi%20Gulf%20Coast%22&hl=en-US&gl=US&ceid=US:en", "https://news.google.com/rss/search?q=Pascagoula%20Mississippi&hl=en-US&gl=US&ceid=US:en", "https://news.google.com/rss/search?q=%22Ocean%20Springs%22%20Mississippi&hl=en-US&gl=US&ceid=US:en", "https://news.google.com/rss/search?q=%22Bay%20St.%20Louis%22%20Mississippi&hl=en-US&gl=US&ceid=US:en"];
var REFRESH_MIN=30, MAX_ITEMS=12;
var FALLBACK=[];
var BUILT_AT="2026-10-25 16:59 UTC";
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function timeAgo(ts){
  var s=Math.max(1,Math.floor(Date.now()/1000-ts));
  if(s<60)return s+'s ago';
  var m=Math.floor(s/60); if(m<60)return m+'m ago';
  var h=Math.floor(m/60); if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function render(items,stamp){
  var list=document.getElementById('gx-news-list');
  if(!items.length){
    list.innerHTML='<div class="gx-news-empty">No headlines right now &mdash; check back soon.</div>';
  }else{
    list.innerHTML=items.map(function(it){
      return '<div class="gx-news-item"><span class="gx-news-src">'+esc(it.source)+'</span>'+
        '<div class="gx-news-body"><p class="gx-news-title"><a href="'+esc(it.link)+
        '" target="_blank" rel="noopener">'+esc(it.title)+'</a></p>'+
        '<div class="gx-news-time">'+esc(timeAgo(it.ts))+'</div></div></div>';
    }).join('');
  }
  document.getElementById('gx-news-updated').textContent='Updated '+stamp;
}
function parseRSS(text){
  var out=[];
  try{
    var xml=new DOMParser().parseFromString(text,'text/xml');
    var nodes=xml.getElementsByTagName('item');
    for(var i=0;i<nodes.length;i++){
      var g=function(t){var n=nodes[i].getElementsByTagName(t)[0];return n?n.textContent:'';};
      var title=g('title'),link=g('link'),pub=g('pubDate');
      var srcNodes=nodes[i].getElementsByTagName('source');
      var src=srcNodes.length?srcNodes[0].textContent:'';
      if(!title||!link)continue;
      var p=title.lastIndexOf(' - ');
      if(p>0){var tail=title.slice(p+3);
        if(!src){src=tail;title=title.slice(0,p);}
        else if(tail===src){title=title.slice(0,p);}}
      var ts=Math.floor(Date.parse(pub)/1000)||0;
      if(ts)out.push({title:title,link:link,source:src||'Google News',ts:ts});
    }
  }catch(e){}
  return out;
}
function fetchFeed(url){
  return fetch(url).then(function(r){if(!r.ok)throw 0;return r.text();})
    .catch(function(){
      return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(url))
        .then(function(r){if(!r.ok)throw 0;return r.text();});
    });
}
function refresh(){
  var stamp=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  Promise.all(FEEDS.map(fetchFeed)).then(function(texts){
    var all=[],seen={};
    texts.forEach(function(t){
      parseRSS(t).forEach(function(it){
        var key=it.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60);
        if(seen[key])return; seen[key]=1; all.push(it);
      });
    });
    all.sort(function(a,b){return b.ts-a.ts;});
    if(all.length)render(all.slice(0,MAX_ITEMS),stamp);
    else render(FALLBACK,'baked snapshot');
  }).catch(function(){render(FALLBACK,'baked snapshot');});
}
var btn=document.getElementById('gx-news-refresh');
if(btn)btn.addEventListener('click',refresh);
render(FALLBACK,'baked snapshot');
refresh();
setInterval(refresh,Math.max(10,REFRESH_MIN)*60000);
})();
</script>
</div>
</body>
</html>
