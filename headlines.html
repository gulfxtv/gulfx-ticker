<title>GulfX TV &mdash; Gulf Coast Headlines</title>

<body style="margin:0;padding:20px;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<div style="max-width:980px;margin:0 auto">
<style>
.gx-news{box-sizing:border-box;max-width:100%;background:#fff;border:1px solid #e2e8f0;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#0f172a}
.gx-news *{box-sizing:border-box}
.gx-news-head{display:flex;align-items:center;gap:8px;background:linear-gradient(90deg,#b8911a,#e8b923);color:#0b1226;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:12px 16px}
.gx-news-head .dot{width:8px;height:8px;border-radius:50%;background:#0b1226;animation:gxnblink 1.2s infinite}
@keyframes gxnblink{0%,100%{opacity:1}50%{opacity:.25}}
.gx-news-list{padding:16px;display:flex;flex-direction:column;gap:16px}
.gx-news-feature{display:block;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#fff}
.gx-news-feature img{width:100%;height:340px;object-fit:cover;display:block}
.gx-news-feature .gx-news-body{padding:18px 20px}
.gx-news-feature .gx-news-title{font-size:28px;font-weight:800;line-height:1.2;margin:0 0 8px}
.gx-news-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gx-news-card{display:block;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;background:#fff}
.gx-news-card img{width:100%;height:170px;object-fit:cover;display:block}
.gx-news-card .gx-news-body{padding:14px 16px}
.gx-news-card .gx-news-title{font-size:20px;font-weight:700;line-height:1.25;margin:0 0 6px}
.gx-news-row{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-top:1px solid #e2e8f0}
.gx-news-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:3px 7px;margin-bottom:6px}
.gx-tag-event{background:#0b1226;color:#e8b923}
.gx-tag-blog{background:#b8911a;color:#0b1226}
.gx-news-card.gx-event,.gx-news-card.gx-blog{border-top:3px solid #e8b923}
.gx-news-meta{font-size:13px;color:#64748b;margin-top:4px}
.gx-news-excerpt{font-size:14px;color:#475569;line-height:1.45;margin:6px 0 0}
.gx-news-src{flex:none;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#0b1226;background:#e8b923;border-radius:5px;padding:3px 7px;margin-top:1px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.gx-news-body{flex:1;min-width:0}
.gx-news-title{font-size:17px;font-weight:600;line-height:1.35;margin:0 0 3px}
.gx-news-title a{color:#0f172a;text-decoration:none}
.gx-news-title a:hover{color:#b8911a;text-decoration:underline}
.gx-news-time{font-size:12px;color:#64748b}
.gx-news-foot{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid #e2e8f0;font-size:12px;color:#64748b}
.gx-news-foot button{background:none;border:1px solid rgba(184,145,26,.6);color:#b8911a;border-radius:6px;font-size:12px;padding:4px 12px;cursor:pointer}
.gx-news-foot button:hover{background:rgba(232,185,35,.15)}
.gx-news-empty{padding:24px 14px;text-align:center;color:#64748b;font-size:14px}
@media(max-width:640px){.gx-news-grid{grid-template-columns:1fr}.gx-news-feature img{height:200px}.gx-news-feature .gx-news-title{font-size:22px}}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function timeAgo(ts){
  var s=Math.max(1,Math.floor(Date.now()/1000-ts));
  if(s<60)return s+'s ago';
  var m=Math.floor(s/60); if(m<60)return m+'m ago';
  var h=Math.floor(m/60); if(h<24)return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function fmtDate(dstr){
  if(!dstr)return '';
  var p=dstr.split('-'); if(p.length<3)return dstr;
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return wd+', '+mo+' '+d.getDate();
}
function render(data,stamp){
  var items=(data&&data.news)||[];
  var events=(data&&data.events)||[];

        '<div><span class="gx-news-src">'+esc(it.source)+'</span> '+
        '<span class="gx-news-time">'+esc(timeAgo(it.ts))+'</span></div></div></article>';
    };

      var isEv=kind==='event';

      var img=(it.image&&/^https?:[/][/]/.test(it.image))?it.image:photo(pi);
      var meta=isEv?[it.time,it.location].filter(Boolean).map(esc).join(' · '):esc(it.excerpt||'');
      var metaCls=isEv?'gx-news-meta':'gx-news-excerpt';
      return '<article class="gx-news-card gx-'+kind+'"><a href="'+esc(link)+
        '" target="_blank" rel="noopener"><img src="'+esc(img)+
        '" alt="" onerror="this.remove()"></a>'+

        '<p class="gx-news-title"><a href="'+esc(link)+

    };
    var row=function(it){
      return '<div class="gx-news-row"><span class="gx-news-src">'+esc(it.source)+'</span>'+
        '<div class="gx-news-body"><p class="gx-news-title"><a href="'+esc(it.link)+

        '<div class="gx-news-time">'+esc(timeAgo(it.ts))+'</div></div></div>';
    };
    var gxRow=function(kind,it){
      var isEv=kind==='event';
      var tag=isEv?'EVENT':'BLOG';
      var link=isEv?'https://gulfxtv.github.io/gulfx-ticker/calendar.html':(it.link||'https://www.gulfxtv.com/');

    blogs.slice(1).forEach(function(bl){html+=gxRow('blog',bl);});
    items.forEach(function(it,i){if(!used[i])html+=row(it);});
    list.innerHTML=html;
  }

function parseRSS(text){
  var out=[];
  try{
    var xml=new DOMParser().parseFromString(text,'text/xml');
    var nodes=xml.getElementsByTagName('item');
    for(var i=0;i<nodes.length;i++){
      var g=function(t){var n=nodes[i].getElementsByTagName(t)[0];return n?n.textContent:'';};
      var title=g('title'),link=g('link'),pub=g('pubDate');
      var srcNodes=nodes[i].getElementsByTagName('source');
      var src=srcNodes.length?srcNodes[0].textContent:'';
      if(!title||!link)continue;
      var p=title.lastIndexOf(' - ');
      if(p>0){var tail=title.slice(p+3);
        if(!src){src=tail;title=title.slice(0,p);}
        else if(tail===src){title=title.slice(0,p);}}
      var ts=Math.floor(Date.parse(pub)/1000)||0;
      if(ts)out.push({title:title,link:link,source:src||'Google News',ts:ts});
    }
  }catch(e){}
  return out;
}

function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
      else cur+=c;
    }else if(c==='"'){q=true;}
    else if(c===','){row.push(cur);cur='';}
    else if(c.charCodeAt(0)===10||c.charCodeAt(0)===13){if(c.charCodeAt(0)===13&&text[i+1].charCodeAt(0)===10)i++;row.push(cur);rows.push(row);row=[];cur='';}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function sheetRows(tab){
  return fetch(sheetURL(tab)).then(function(r){if(!r.ok)throw 0;return r.text();})
    .catch(function(){
      return fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(sheetURL(tab)))
        .then(function(r){if(!r.ok)throw 0;return r.text();});
    })
    .then(function(t){
      var rows=parseCSV(t); if(rows.length<2)return [];
      var head=rows[0].map(function(h){return h.trim();});
      return rows.slice(1).map(function(r){
        var o={}; head.forEach(function(h,i){o[h]=r[i]||'';}); return o;
      }).filter(function(o){return (o.Title||'').trim();});
    }).catch(function(){return null;});
}

  if(!rows)return null;
  var today=new Date(); today.setHours(0,0,0,0);
  var out=rows.filter(function(r){
    return (r.Approved||'').trim().toUpperCase()==='TRUE' && r.Date && r.Date.slice(0,10)>=today.toISOString().slice(0,10);
  }).map(function(r){return {title:r.Title.trim(),date:r.Date.trim().slice(0,10),time:(r.Time||'').trim(),location:(r.Location||'').trim(),category:(r.Category||'').trim(),desc:(r.Description||'').trim()};});
  out.sort(function(a,b){return a.date<b.date?-1:1;});
  return out.slice(0,3);
}
function latestBlogs(rows){
  if(!rows)return null;
  var out=rows.filter(function(r){
    return (r.Approved||'').trim().toUpperCase()==='TRUE';
  }).map(function(r){return {title:r.Title.trim(),date:(r.Date||'').trim().slice(0,10),link:(r.Link||'').trim(),excerpt:(r.Excerpt||'').trim(),image:(r.Image||'').trim(),category:(r.Category||'').trim()};});
  out.sort(function(a,b){return a.date<b.date?-1:1;});
  return out.slice(0,3);
}
function refresh(){
  var stamp=new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  var newsP=Promise.all(FEEDS.map(fetchFeed)).then(function(texts){
    var all=[],seen={};
    texts.forEach(function(t){
      parseRSS(t).forEach(function(it){
        var key=it.title.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,60);
        if(seen[key])return; seen[key]=1; all.push(it);
      });
    });
    all.sort(function(a,b){return b.ts-a.ts;});
    return all.length?all.slice(0,MAX_ITEMS):null;
  }).catch(function(){return null;});
  var evP=sheetRows('Events').then(upcomingEvents);
  var blP=sheetRows('Blog').then(latestBlogs);
  Promise.all([newsP,evP,blP]).then(function(res){
    render({news:res[0]||FALLBACK.news,events:res[1]===null?FALLBACK.events:res[1],blogs:res[2]===null?FALLBACK.blogs:res[2]},stamp);
  });
}
var btn=document.getElementById('gx-news-refresh');
if(btn)btn.addEventListener('click',refresh);
render(FALLBACK,'baked snapshot');
refresh();
setInterval(refresh,Math.max(10,REFRESH_MIN)*60000);
})();
</script>
</div>
</body>
