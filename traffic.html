<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GulfX TV &mdash; Coast Traffic</title>
</head>
<body style="margin:0;padding:20px;background:#0b1226;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
<div style="max-width:720px;margin:0 auto">
<style>
.gx-traffic{box-sizing:border-box;max-width:100%;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:14px;padding:14px 16px;color:var(--hatch-widget-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.gx-traffic *{box-sizing:border-box}
.gx-traf-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.gx-traf-brand{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hatch-widget-accent)}
.gx-traf-title{font-size:18px;font-weight:700}
.gx-traf-src{font-size:11px;color:var(--hatch-widget-muted);text-align:right;line-height:1.5}
.gx-traf-src a{color:var(--hatch-widget-accent);text-decoration:none}
.gx-traf-mapwrap{border:1px solid var(--hatch-widget-border);border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--hatch-widget-surface-muted)}
.gx-traf-mapwrap iframe{width:100%;height:420px;border:0;display:block}
.gx-traf-mapbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-top:1px solid var(--hatch-widget-border);font-size:12px;color:var(--hatch-widget-muted)}
.gx-traf-mapbar a{color:var(--hatch-widget-accent);text-decoration:none;font-weight:600}
.gx-traf-updated{font-size:11px;color:var(--hatch-widget-muted);margin:10px 0 6px}
.gx-traf-updated a{color:var(--hatch-widget-accent);text-decoration:none}
.gx-traf-alert{border:1px solid var(--hatch-widget-border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:var(--hatch-widget-surface)}
.gx-traf-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.gx-traf-impact{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#fff;border-radius:6px;padding:2px 8px}
.gx-traf-loc{font-size:14px;font-weight:700}
.gx-traf-meta{font-size:12px;color:var(--hatch-widget-muted);line-height:1.5}
.gx-traf-county{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--hatch-widget-muted);border:1px solid var(--hatch-widget-border);border-radius:6px;padding:2px 8px}
</style>
<div class="gx-traffic">
  <div class="gx-traf-head">
    <div><div class="gx-traf-brand">GulfX TV</div><div class="gx-traf-title">Coast Traffic</div></div>
    <div class="gx-traf-src">Live data: Mississippi<br>Dept. of Transportation</div>
  </div>
  <div class="gx-traf-mapwrap">
    <iframe src="https://www.mdottraffic.com/" title="MDOT live traffic map" loading="lazy"></iframe>
    <div class="gx-traf-mapbar"><span>Live MDOT traffic map</span><a href="https://www.mdottraffic.com/" target="_blank" rel="noopener">Open full map &rarr;</a></div>
  </div>
  <div class="gx-traf-updated" id="gx-traf-updated"></div>
  <div id="gx-traf-list"></div>
</div>
<script>
(function(){
/* Coast-county alerts scraped from MDOT on 2026-10-09.
   To refresh: re-scrape https://www.mdottraffic.com/listView_alerts.aspx
   and replace this array (Hancock, Harrison, Jackson, Pearl River, Stone, George). */
var UPDATED='October 22, 2026'; /*__WIDGET_UPDATED__*/
/*__WIDGET_ALERTS_START__*/
var ALERTS=[
 {loc:'US 90 between MS 604 and Camp Rd',county:'Hancock',impact:'Closed',dir:'Westbound',lanes:'Road closed',why:'Bridge Repair / Inspection -- The US 90 drawbridge over the Pearl River will be closed for emergency repairs. Detour signage will be in plac',dates:'May 24, 10 AM - Dec 29, 4 PM'},
 {loc:'MS 57 between I-10 and Humphrey Rd',county:'Jackson',impact:'High',dir:'Northbound',lanes:'Expect delays',why:'Traffic Switch -- Northbound traffic will be placed on the newly constructed southbound side in a head-to-head configuration for',dates:'Jan 21, 7 AM - Mar 5, 5 PM'},
 {loc:'I-10 between Long Beach / County Farm Rd EX 28 and MS 43 / MS 603 / Bay St Louis EX 13',county:'Harrison',impact:'Moderate',dir:'Both Directions',lanes:'Expect delays',why:'Resurfacing or Paving -- Alternating lane closures. Motorists should use caution when approaching the area. Westbound commercial traffi',dates:'Mar 14, 2 PM - Mar 1, 3 PM'},
 {loc:'MS 26 between LA State Line and Grady Lewis Rd',county:'Pearl River',impact:'Moderate',dir:'Both Directions',lanes:'Expect delays',why:'Resurfacing or Paving -- Alternating lane closures. Flaggers will be present.',dates:'Aug 20, 7 AM - Oct 23, 4 PM'},
 {loc:'MS 53 at US 49',county:'Harrison',impact:'Moderate',dir:'Eastbound',lanes:'Expect delays',why:'Turn Lane Construction -- Crews will be staged in the median.',dates:'Aug 7, 7 AM - Oct 30, 5 PM'},
 {loc:'MS 67 between Sangani Blvd and US 49 N',county:'Harrison',impact:'Moderate',dir:'Both Directions',lanes:'Expect delays',why:'Safety Improvements -- Alternating lane closures. Motorists should be on high alert for roadside workers.',dates:'Jan 27, 4 PM - Dec 11, 5 PM'},
 {loc:'US 11 between Goodyear Blvd and MS 43',county:'Pearl River',impact:'Moderate',dir:'Northbound',lanes:'Expect delays',why:'Bridge Replacement -- 5th St. is currently closed to through traffic.',dates:'Oct 3, 4 PM - Nov 9, 3 PM'},
 {loc:'US 49 at South Swan Rd',county:'Harrison',impact:'Moderate',dir:'Northbound',lanes:'Expect delays',why:'Resurfacing or Paving -- There will be no eastbound access to South Swan Road, as crews complete work at the intersection. Detour signa',dates:'Aug 10, 7 AM - Oct 30, 4 PM'},
 {loc:'US 49 between Oneal Rd and School Rd',county:'Harrison',impact:'Moderate',dir:'Both Directions',lanes:'Expect delays',why:'Highway Widening -- Alternating  lane closures.',dates:'Aug 6, 11 AM - Jun 4, 4 PM'},
 {loc:'US 90 at MS 603 N / Nicholson Ave S',county:'Hancock',impact:'Moderate',dir:'Westbound',lanes:'Right lane closed',why:'Turn Lane Construction',dates:'Sep 8, 6 AM - Oct 30, 3 PM'}
];
/*__WIDGET_ALERTS_END__*/
var COLORS={'Closed':'#dc2626','High':'#ea580c','Moderate':'#b8911a','Minimal':'#64748b','ROAD':'#8b5cf6'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
document.getElementById('gx-traf-updated').innerHTML='Coast alerts updated '+esc(UPDATED)+' &middot; <a href="https://www.mdottraffic.com/listView_alerts.aspx" target="_blank" rel="noopener">View all statewide on MDOT</a>';
document.getElementById('gx-traf-list').innerHTML=ALERTS.map(function(a){
  return '<div class="gx-traf-alert"><div class="gx-traf-top">'+
    '<span class="gx-traf-impact" style="background:'+(COLORS[a.impact]||'#64748b')+'">'+esc(a.impact)+'</span>'+
    '<span class="gx-traf-loc">'+esc(a.loc)+'</span>'+
    '<span class="gx-traf-county">'+esc(a.county)+' Co.</span></div>'+
    '<div class="gx-traf-meta">'+esc(a.dir)+' &middot; '+esc(a.lanes)+'<br>'+esc(a.why)+'<br>'+esc(a.dates)+'</div></div>';
}).join('');
})();
</script>
</div>
</body>
</html>
